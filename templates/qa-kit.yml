# Copy to .github/workflows/qa-kit.yml. Needs the ANTHROPIC_API_KEY secret and `.qa/` plus `.qa-kit/`
# in .gitignore. Make "kontrol" a required check on main.
# GitHub only reviews the code, so no project setup is needed: the tests and attacks run on the
# author's computer with /qa-kit:kontrol before the PR (the commit then shows "qa-kit/local").
name: qa-kit

on:
  # Only PRs into the branch qa-kit.json calls "base": a release PR (main → production) carries
  # code that was already checked on its way into main.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# The plugin, the report tool and the pre-push hook run one qa-kit release: bump it here and there together.
env:
  QA_KIT_REF: v0.6.2

# A new push cancels the run for the old one, so an older report never overwrites a newer one.
concurrency:
  group: qa-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrol:
    name: kontrol
    # Drafts are unfinished work, so they wait for "Ready for review". Fork and Dependabot PRs get
    # no secrets, so they are skipped rather than always red.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The plugin from the pinned release rather than qa-kit's default branch: it runs with this
      # workflow's secrets. The action takes a marketplace URL only without a ref, so the release is
      # checked out and installed from its path.
      - uses: actions/checkout@v4
        with:
          repository: Boby-AI/qa-kit
          ref: ${{ env.QA_KIT_REF }}
          path: .qa-kit
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        # The reviewer posts findings with `qa-kit comment` as it finds them.
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: ${{ github.workspace }}/.qa-kit
          plugins: qa-kit@boby
          prompt: /qa-kit:kontrol
          claude_args: --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent"
      - name: Report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx --yes "github:Boby-AI/qa-kit#${QA_KIT_REF}" report
