# Copy to .github/workflows/qa-kit.yml and replace the SETUP step with the project's own.
# Needs the ANTHROPIC_API_KEY secret and `.qa/` plus `.qa-kit/` in .gitignore. Make "kontrol" a required
# check on main.
name: qa-kit

on:
  # Only PRs into the branch qa-kit.json calls "base": a release PR (main → production) carries
  # code that was already checked on its way into main.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      parts:
        description: Parts to scan (empty = all)
        required: false

permissions:
  contents: read
  pull-requests: write

# The plugin, the report tool and the pre-push hook run one qa-kit release: bump it here and there together.
env:
  QA_KIT_REF: v0.5.8

# A new push cancels the run for the old one, so an older report never overwrites a newer one.
concurrency:
  group: qa-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # SETUP: install the toolchain and dependencies, e.g. `uses: ./.github/actions/setup`
      - run: npx --yes "github:Boby-AI/qa-kit#${QA_KIT_REF}" fast

  kontrol:
    name: ${{ github.event_name == 'pull_request' && 'kontrol' || 'tam-tarama' }}
    # Drafts are unfinished work, so they wait for "Ready for review". Fork and Dependabot PRs get
    # no secrets, so they are skipped rather than always red.
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # SETUP: same as above
      # The plugin from the pinned release rather than qa-kit's default branch: it runs with this
      # workflow's secrets. The action takes a marketplace URL only without a ref, so the release is
      # checked out and installed from its path.
      - uses: actions/checkout@v4
        with:
          repository: Boby-AI/qa-kit
          ref: ${{ env.QA_KIT_REF }}
          path: .qa-kit
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        # The reviewer and adversary post findings with `qa-kit comment` as they find them.
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: ${{ github.workspace }}/.qa-kit
          plugins: qa-kit@boby
          prompt: ${{ github.event_name == 'pull_request' && '/qa-kit:kontrol' || format('/qa-kit:tam-tarama {0}', inputs.parts) }}
          claude_args: --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent"
      - name: Report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx --yes "github:Boby-AI/qa-kit#${QA_KIT_REF}" report
